<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Background Remover</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="container py-5">
      <section class="mx-auto app-shell">
        <h1 class="h3 mb-3">Background Remover</h1>
        <form method="post" enctype="multipart/form-data" class="upload-panel">
          <label for="image" class="form-label">Upload a PNG or JPG image</label>
          <input
            class="form-control"
            type="file"
            id="image"
            name="image"
            accept=".png,.jpg,.jpeg,image/png,image/jpeg"
          >
          <button type="submit" class="btn btn-primary mt-3">Remove Background</button>
        </form>
      </section>
    </main>
  </body>
</html>
